<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redshift</title>
    <style>
      /* The canvas is 480 x 270 at a whole-number zoom (src/main.ts), centred;
         the page background is the letterbox around it. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      /* Phaser sets crisp scaling too (pixelArt: true); this keeps it before boot. */
      canvas {
        display: block;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
