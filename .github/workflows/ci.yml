name: CI

# Third-party actions are pinned to a full commit SHA (security review LOW 18);
# the comment names the tag. To update: `git ls-remote https://github.com/actions/<name> refs/tags/<tag>`.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Fails on a known high or critical advisory in any dependency.
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # The itch.io build must not carry the QA hook (docs/tech/architecture.md, "QA hook").
      # The e2e job's build sets VITE_QA_HOOK=1 through playwright.config.ts.
      - name: No QA hook in the release build
        run: |
          if grep -rqw "__redshift" dist/; then
            echo "::error::window.__redshift found in dist/ (was VITE_QA_HOOK set?)"
            exit 1
          fi

      # The itch.io zip exactly as released: refuses the QA hook, unknown VITE_ variables,
      # secret keys, source maps, .env files and bundled recordings (CLAUDE.md Commands).
      - name: Package the itch.io zip
        run: npm run package

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
