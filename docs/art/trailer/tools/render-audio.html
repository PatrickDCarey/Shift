<!doctype html>
<meta charset="utf-8">
<title>render-audio (trailer, offline)</title>
<script type="module">
  // Drives the game's own audio modules (engine, music, sfx) through an OfflineAudioContext.
  import { createAudioEngine } from '/src/audio/engine.ts';
  import { createMusic } from '/src/audio/music.ts';
  import { createSfx } from '/src/audio/sfx.ts';

  const SR = 48000;

  // The offline context reports 'suspended' until rendering; the engine only plays when 'running'.
  function runningView(ctx) {
    return new Proxy(ctx, {
      get(t, k) {
        if (k === 'state') return 'running';
        if (k === 'resume') return () => Promise.resolve();
        const v = Reflect.get(t, k, t);
        return typeof v === 'function' ? v.bind(t) : v;
      },
      set(t, k, v) { t[k] = v; return true; },
    });
  }

  function makeEngine(seconds) {
    const off = new OfflineAudioContext(2, Math.ceil(seconds * SR), SR);
    const view = runningView(off);
    const engine = createAudioEngine({ contextFactory: () => view });
    return { off, engine };
  }

  function pack(buf) {
    const n = buf.length, l = buf.getChannelData(0), r = buf.getChannelData(1);
    const out = new Float32Array(n * 2);
    for (let i = 0; i < n; i++) { out[2 * i] = l[i]; out[2 * i + 1] = r[i]; }
    const u8 = new Uint8Array(out.buffer);
    const parts = [];
    for (let i = 0; i < u8.length; i += 0x8000) parts.push(String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)));
    return btoa(parts.join(''));
  }

  // timeline: [[seconds, band], ...] sorted; music is updated at 60 Hz like the game scene.
  window.renderBed = async (timeline, seconds) => {
    const { off, engine } = makeEngine(seconds);
    await engine.unlock();
    const music = createMusic(engine);
    const bandAt = (t) => { let b = timeline[0][1]; for (const [s, v] of timeline) if (s <= t) b = v; return b; };
    const frames = Math.floor(seconds * 60);
    const step = (i) => {
      if (i >= frames) return;
      off.suspend(i / 60 + 1e-4).then(() => {
        music.update({ bodies: [{ band: bandAt(i / 60), home: false }] });
        step(i + 1);
        off.resume();
      });
    };
    music.update({ bodies: [{ band: bandAt(0), home: false }] });
    step(1);
    const buf = await off.startRendering();
    return pack(buf);
  };

  window.renderCue = async (name, seconds) => {
    const { off, engine } = makeEngine(seconds);
    await engine.unlock();
    const sfx = createSfx(engine);
    const play = {
      shiftUp: () => sfx.shiftUp(2, 3),
      shiftDown: () => sfx.shiftDown(3, 2),
      jump: () => sfx.jump(3),
      land: () => sfx.land(3),
      fallThrough: () => sfx.fallThrough(),
      reset: () => sfx.reset(),
      shot: () => sfx.shot(4, true),
      hitDeath: () => sfx.hitDeath(),
      post: () => sfx.post(),
      levelComplete: () => sfx.levelComplete(),
    }[name];
    if (play() < 1) throw new Error('cue not scheduled: ' + name);
    const buf = await off.startRendering();
    return pack(buf);
  };
  window.ready = true;
</script>
